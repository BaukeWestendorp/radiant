[workspace]
members = ["rd", "rd-artnet", "rd-app", "rd-dmx", "rd-midi", "rd-service", "rd-ui",]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rd = { path = "rd" }
rd-midi = { path = "rd-midi" }
rd-service = { path = "rd-service" }
rd-ui = { path = "rd-ui" }

anyhow = "1.0"

gpui = { git = "https://github.com/zed-industries/zed.git", rev = "d5fc4b7" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = ["font-kit"], rev = "d5fc4b7" }

flume = "0.12.0"

log = "0.4.29"
pretty_env_logger = "0.5.0"

facet = "0.46.5"
facet-json = "0.46.1"
facet-error = "0.46.5"

serde = { version = "1.0.228", features = ["derive"] }

uuid = "1.23.4"
