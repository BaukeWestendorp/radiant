[package]
name = "rd-artnet"
version.workspace = true
edition.workspace = true

[features]
default = ["node"]
node = ["dep:flume", "dep:if-addrs", "dep:mac_address", "dep:socket2"]
facet = ["dep:facet", "dep:facet-validate"]

[dependencies]
log.workspace = true

bytes = "1.12.1"
modular-bitfield = "0.13.1"

# feature = "node"
flume = { workspace = true, optional = true }
if-addrs = { version = "0.15.0", optional = true }
mac_address = { version = "1.1.8", optional = true }
socket2 = { version = "0.6.4", features = ["all"], optional = true }
thiserror = "2.0.18"

# feature = "facet"
facet = { workspace = true, features = ["net"], optional = true }
facet-validate = { workspace = true, optional = true }
spin_sleep = "1.3.3"

[dev-dependencies]
pretty_env_logger.workspace = true

[[examples]]
name = "node"
features = ["node"]
